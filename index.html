<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFEFF3"><title>냥이 대탈출</title>
<link rel="stylesheet" href="css/app.css"></head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <button class="mochi round" id="btnPause" aria-label="일시정지"><svg viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="4" height="13" rx="2" fill="#C98DA0"/><rect x="13.5" y="5.5" width="4" height="13" rx="2" fill="#C98DA0"/></svg></button>
  <div id="banner"><div class="st" id="stTxt">레벨 1</div><span class="tier" id="stTag">보통</span></div>
  <div class="mochi coins"><span class="fishico"></span><span class="coinTxt">0</span></div>
</div>
<div id="hearts" class="hidden"></div>
<div id="gaugeRow" class="hidden"><svg width="20" height="20" viewBox="0 0 30 30"><g transform="rotate(-35 15 15)"><rect x="11" y="3" width="8" height="22" rx="3" fill="#FF9CB5" stroke="#E3728F" stroke-width="1.5"/><rect x="11" y="12" width="8" height="4" fill="#fff"/></g></svg><div id="gauge"><div id="gfill"></div></div></div>
<div id="timer" class="hidden"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="#fff" stroke="#9FC9F0" stroke-width="2.4"/><path d="M12 9v4l3 2" stroke="#7AA8D8" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="10" y="2.5" width="4" height="3" rx="1" fill="#9FC9F0"/></svg><div class="tb"><i></i></div><b>0:00</b></div>
<div id="progress" class="hidden"><div class="bar" id="bar"></div><div class="lbl" id="plbl"></div></div>
<div id="combo" class="hidden"><div class="n" id="cn">x2</div><div class="l">냥콤보</div></div>
<div id="items" class="hidden">
 <button class="mochi item" data-b="hint"><svg viewBox="0 0 40 40"><path d="M20 5a11 11 0 0 1 6.6 19.8c-1 .8-1.6 2-1.6 3.2v1H15v-1c0-1.2-.6-2.4-1.6-3.2A11 11 0 0 1 20 5z" fill="#FFE38A" stroke="#F0B43C" stroke-width="2"/><rect x="15" y="30" width="10" height="5" rx="2.5" fill="#E8C7D1"/><circle cx="16.5" cy="16" r="1.8" fill="#7A5260"/><circle cx="23.5" cy="16" r="1.8" fill="#7A5260"/><path d="M18 20q2 2 4 0" stroke="#7A5260" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>힌트<span class="badge"></span></button>
 <button class="mochi item" data-b="shield"><svg viewBox="0 0 40 40"><ellipse cx="20" cy="25" rx="16" ry="9" fill="#BFE3FA" stroke="#8CC4EA" stroke-width="2"/><ellipse cx="20" cy="21" rx="15" ry="8" fill="#DDF0FD" stroke="#8CC4EA" stroke-width="2"/><path d="M20 24c-3-2.2-4.5-3.6-4.5-5a2.2 2.2 0 0 1 4.5-.6 2.2 2.2 0 0 1 4.5.6c0 1.4-1.5 2.8-4.5 5z" fill="#FF9CB5"/></svg>방석<span class="badge"></span></button>
 <button class="mochi item" data-b="time"><svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="13" fill="#E9F4FF" stroke="#8CC4EA" stroke-width="2.5"/><path d="M20 15v7l5 3" stroke="#5DA3D6" stroke-width="2.6" fill="none" stroke-linecap="round"/><rect x="16" y="4" width="8" height="5" rx="2" fill="#8CC4EA"/><text x="30" y="14" font-size="9" font-weight="900" fill="#FF7F95" font-family="sans-serif">+15</text></svg>시간<span class="badge"></span></button>
 <button class="mochi item" data-b="lift"><svg viewBox="0 0 40 40"><path d="M11 21v-8a2.5 2.5 0 0 1 5 0v5-9a2.5 2.5 0 0 1 5 0v9-7a2.5 2.5 0 0 1 5 0v8-4a2.5 2.5 0 0 1 5 0v10c0 7-5 11-11 11s-9-3-11.5-8l-3-6a2.4 2.4 0 0 1 4-2.4z" fill="#FFF" stroke="#E79AB0" stroke-width="2"/><circle cx="21" cy="28" r="3" fill="#FFC2D1"/></svg>집어올리기<span class="badge"></span></button>
</div>
<div id="home">
  <div class="top"><div class="left">
      <button class="mochi round" id="btnSet" aria-label="설정"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="#E0C3CD"/><g fill="#E0C3CD"><rect x="14" y="3" width="4" height="7" rx="1.5"/><rect x="14" y="22" width="4" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="4" rx="1.5"/><rect x="22" y="14" width="7" height="4" rx="1.5"/></g><circle cx="16" cy="16" r="4" fill="#fff"/></svg></button>
      <button class="mochi noads" id="btnNoAds"><svg width="18" height="18" viewBox="0 0 20 20"><rect x="2" y="4" width="16" height="12" rx="3" fill="#FFB547"/><text x="10" y="13.5" font-size="7" text-anchor="middle" fill="#fff" font-weight="900" font-family="sans-serif">AD</text><path d="M3 3l14 14" stroke="#FF6F8A" stroke-width="2.4" stroke-linecap="round"/></svg>광고 제거</button></div>
    <div class="mochi coins"><span class="fishico"></span><span class="coinTxt">0</span></div></div>
  <div class="topbtns"><button class="mochi round sm" id="btnAch" aria-label="업적"><svg viewBox="0 0 32 32"><path d="M10 5h12v6a6 6 0 0 1-12 0z" fill="#FFD457" stroke="#E0A812" stroke-width="1.8"/><path d="M10 7H6a4 4 0 0 0 4 6M22 7h4a4 4 0 0 1-4 6" stroke="#E0A812" stroke-width="1.8" fill="none"/><rect x="14" y="17" width="4" height="5" fill="#E0A812"/><rect x="10" y="22" width="12" height="4" rx="2" fill="#F4B6C6"/></svg><i class="dot hidden" id="achDot"></i></button></div>
  <div class="logo">냥이 대탈출</div><div class="sub">목욕은 싫다냥!</div>
  <div class="mochi albumcard" id="albumCard"><div class="picframe"><img id="homePic" alt=""><div class="pieces" id="homePieces"></div></div>
    <div style="flex:1"><div class="t1" id="chapTxt">챕터 1</div><div class="t2" id="picName"></div><div class="pbar"><b id="pbar"></b></div><div style="font-size:12px;font-weight:900;margin-top:4px;color:var(--ink2)" id="pieceTxt"></div></div></div>
  <canvas id="homeCat" width="260" height="190"></canvas>
  <div class="road" id="road"></div>
  <button class="lvlbtn" id="btnPlay">레벨 1<small>탭해서 시작</small></button>
  <div class="streak" id="streak"></div>
  <div class="chestbar mochi" id="chestBar"><span class="cico"><svg viewBox="0 0 32 32" width="22" height="22"><rect x="6" y="14" width="20" height="13" rx="3" fill="#FF9CB5"/><rect x="4" y="10" width="24" height="6" rx="2" fill="#FFB6C9"/><rect x="14" y="10" width="4" height="17" fill="#FFE38A"/><path d="M16 10c-5-6-9-1-4 0M16 10c5-6 9-1 4 0" stroke="#FFE38A" stroke-width="2.4" fill="none"/></svg></span><div class="cline" id="chest"></div><small id="chestTxt"></small></div>
  <div class="homebar">
    <button class="mochi hb" id="btnShop"><svg viewBox="0 0 32 32"><path d="M6 12h20l-2 14H8z" fill="#FFB6C9" stroke="#E3728F" stroke-width="1.8" stroke-linejoin="round"/><path d="M11 12a5 5 0 0 1 10 0" stroke="#E3728F" stroke-width="2" fill="none"/></svg>상점</button>
    <button class="mochi hb" id="btnTower"><svg viewBox="0 0 32 32"><rect x="6" y="25" width="20" height="4" rx="2" fill="#F4B6C6"/><rect x="9" y="8" width="4" height="17" fill="#F1D3A9" stroke="#D3A774" stroke-width="1.2"/><rect x="19" y="13" width="4" height="12" fill="#F1D3A9" stroke="#D3A774" stroke-width="1.2"/><rect x="5" y="13" width="14" height="4" rx="2" fill="#D7EEFF" stroke="#9CCBEB" stroke-width="1.2"/><rect x="14" y="6" width="14" height="4" rx="2" fill="#FFD6E2" stroke="#F2A9BD" stroke-width="1.2"/><circle cx="21" cy="4" r="2.4" fill="#FFCF8A"/></svg>캣타워<i class="dot hidden" id="towerDot"></i></button>
    <button class="mochi hb" id="btnCats"><svg viewBox="0 0 32 32"><path d="M9 9l2-5 4 4h2l4-4 2 5c2 2 3 5 3 8 0 6-5 10-10 10S6 23 6 17c0-3 1-6 3-8z" fill="#FFCF8A" stroke="#E3A35A" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12.5" cy="16" r="1.6" fill="#4A3A35"/><circle cx="19.5" cy="16" r="1.6" fill="#4A3A35"/><path d="M16 23c-2.2-1.6-3.4-2.7-3.4-3.8a1.7 1.7 0 0 1 3.4-.5 1.7 1.7 0 0 1 3.4.5c0 1.1-1.2 2.2-3.4 3.8z" fill="#FF7F95"/></svg>냥이들</button>
    <button class="mochi hb" id="btnAlbum"><svg viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="20" rx="4" fill="#FFF" stroke="#E3728F" stroke-width="1.8"/><circle cx="12" cy="13" r="3" fill="#FFD457"/><path d="M7 24l7-7 5 5 3-3 4 4" stroke="#9FD6B6" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg>앨범</button>
    <button class="mochi hb" id="btnDaily"><svg viewBox="0 0 32 32"><rect x="6" y="13" width="20" height="14" rx="3" fill="#FF8FB1"/><rect x="4" y="9" width="24" height="6" rx="2" fill="#FFADC6"/><rect x="14" y="9" width="4" height="18" fill="#FFE066"/></svg>출석<i class="dot hidden" id="dailyDot"></i></button>
  </div>
</div>
<div id="splash" class="hidden"><div class="box"><img id="splashCat" width="150" alt=""><div class="big" id="splashT"></div><div class="chip" id="splashS"></div></div></div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>
<div id="toast" class="hidden"></div>
<script src="js/catart.js"></script>
<script src="js/platform.js"></script>
<script src="js/game.js"></script>
<script src="js/story.js"></script>
<script src="js/tower.js"></script>
<script src="js/app.js"></script>
<script src="js/cute.js"></script>
<script src="js/meta.js"></script>
</body></html>
